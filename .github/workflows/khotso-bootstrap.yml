name: Bootstrap Khotso Voice Website

on:
  push:
    branches:
      - agent/build-khotso-voice-website
    paths:
      - ".khotso-bootstrap/**"
      - ".github/workflows/khotso-bootstrap.yml"

permissions:
  contents: write

concurrency:
  group: khotso-bootstrap
  cancel-in-progress: false

jobs:
  unpack:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/build-khotso-voice-website
          fetch-depth: 0
      - name: Reconstruct and verify source archive
        shell: bash
        run: |
          set -euo pipefail
          cat .khotso-bootstrap/chunk-*.b64 | base64 --decode > /tmp/khotso-source.tar.gz
          echo "b73de91f9dfe9387e3b47b03fdb3bf935810f0bfe4cc6290faae0314ceb5c312  /tmp/khotso-source.tar.gz" | sha256sum --check -
          tar -tzf /tmp/khotso-source.tar.gz >/dev/null
      - name: Unpack tested website source
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf /tmp/khotso-source.tar.gz
          rm -rf .khotso-bootstrap
          rm -f .github/workflows/khotso-bootstrap.yml
      - name: Validate unpacked source
        shell: bash
        run: |
          set -euo pipefail
          cd khotso-voice-website
          python -m py_compile app.py companion_prompt.py
          python -m unittest discover -s tests -v
          node --check static/app.js
          node --check static/service-worker.js
          test ! -f .env
          test ! -f data/khotso.db
          if grep -RIE --exclude='.env.example' --exclude-dir='.git' 'sk-[A-Za-z0-9_-]{20,}' .; then
            echo 'A value resembling an OpenAI API key was found.' >&2
            exit 1
          fi
      - name: Commit expanded source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Build Khotso voice website"
          git push origin HEAD:agent/build-khotso-voice-website
